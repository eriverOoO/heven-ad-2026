ad_planner:
  ros__parameters:
    data_dir: ""
    path_file: "path/2026_molit_comp_global_path.txt"
    control_period_sec: 0.05
    tuning.lease_required: false
    tuning.lease_timeout_sec: 1.0
    topics.tuning_lease: "/ad/tuning/lease"
    local_motion.backend: "dwa"
    path_tracking.backend: "stanley"
    route_corridor_file: "map/route_corridor.json"
    local_motion.odom_frame: "odom"
    local_motion.map_frame: "map"
    # Measured on heven-left with the full MORAI perception stack:
    # grid/odom skew p95=0.459 s, p99=0.685 s.  Both inputs are transformed
    # into odom at their own stamps, so accept the observed pipeline latency
    # while retaining an upper bound for genuinely stale data.
    local_motion.max_grid_odom_skew_sec: 0.75
    local_motion.max_odometry_age_sec: 0.50
    local_motion.max_grid_age_sec: 0.80
    # The default LiDAR composition runs tracking and prediction. Missing,
    # malformed, stale, or future-skewed predictions therefore fail closed.
    # Set "disabled" only for an explicitly static-OGM-only composition.
    local_motion.prediction.mode: "required"
    local_motion.prediction_timeout_sec: 0.50
    local_motion.corridor_window.behind_m: 10.0
    # Covers the 58.5 km/h rollout plus a conservative 1.8 m/s^2 full stop.
    local_motion.corridor_window.ahead_m: 100.0
    local_motion.maximum_steering_rate_radps: 2.0943951023931953
    road_gate.enabled: true

    # Opt-in: apply the cut-in response as an upper bound on the path-tracking
    # longitudinal target (final target = min(existing target, cut-in limit)).
    # Default off -> no subscription, no behaviour change. SLOWDOWN caps at the
    # requested speed; HOLD caps at 0.0. Comfortable / maximum deceleration and
    # every cut-in threshold stay owned by Cut-in Response and are not repeated
    # here. cut_in_response_max_age_s is the consumer-side freshness timeout;
    # absent or stale -> no constraint.
    enable_cut_in_response_constraint: false
    cut_in_response_max_age_s: 0.5

    # Opt-in: apply the roundabout gap response as an upper bound on the
    # path-tracking longitudinal target (final target = min(existing target,
    # cut-in limit, roundabout limit) - the most restrictive active source wins,
    # order-independent). Default off -> no subscription, no behaviour change.
    # RELEASE removes only the roundabout cap; YIELD caps at the response's own
    # published comfortable-stop envelope; HOLD caps at 0.0. The comfortable
    # deceleration and every roundabout policy threshold stay owned by
    # Roundabout Gap Response and are not repeated here.
    # roundabout_response_max_age_s is the consumer-side freshness timeout
    # (mirrors the response node's own maximum_input_age_s); absent or stale ->
    # no constraint.
    enable_roundabout_response_constraint: false
    roundabout_response_max_age_s: 0.5

    # Opt-in: consume the highway merge gap response at the planner / highway
    # mission boundary. Default off -> no subscription, no merge authorization,
    # no behaviour change. A fresh active MERGE_READY exposes a revocable
    # merge-authorization fact (context.highway_merge_authorized, the
    # HighwayMergeReady BT condition, and the
    # /ad/planner/highway_merge_authorized diagnostic) without executing a lane
    # change; it imposes no longitudinal cap. WAIT caps the path-tracking target
    # at the response's own published comfortable-stop envelope (final target =
    # min(existing target, cut-in limit, roundabout limit, highway merge limit),
    # most-restrictive wins, order-independent); HOLD caps at 0.0. Every merge
    # policy threshold and the comfortable deceleration stay owned by Highway
    # Merge Gap Response and are not repeated here.
    # highway_merge_response_max_age_s is the consumer-side freshness timeout
    # (mirrors the response node's own maximum_input_age_s); absent or stale ->
    # no constraint and no authorization (never latched). A response whose
    # merge_zone_id is not expected_highway_merge_zone is ignored wholesale; an
    # empty value accepts any zone.
    enable_highway_merge_response_integration: false
    highway_merge_response_max_age_s: 0.5
    expected_highway_merge_zone: "kcity_highway_onramp"

    # Opt-in Highway Merge Mission Primitive. Default off -> no merge geometry
    # loaded, mission state INACTIVE, no BT / behaviour change. It commands
    # nothing (no steering, lane change, CtrlCmd, or speed): it only tracks
    # approach / waiting / authorization / commitment / completion from
    # source-grounded route geometry so a future lateral executor knows when
    # authorization is still revocable (before commit) versus when a merge is
    # committed and must not be reversed mid-maneuver. Its only decision input
    # is the merge-authorization fact from
    # enable_highway_merge_response_integration; the two flags are independent
    # (mission on / response integration off -> authorization always false ->
    # the mission never leaves APPROACH / WAITING).
    #   mission_approach_window_m       : APPROACH begins this far (route_s)
    #                                     before the merge zone entry. Keep
    #                                     <= the risk node's
    #                                     maximum_ego_approach_distance_m (400).
    #   commit_lateral_separation_m     : the commit boundary is the first
    #                                     source-lane (route:0:left:1) station
    #                                     whose lateral separation from the
    #                                     target lane (route:0) has fallen below
    #                                     this. 3.5 m == the first ~0.44 m
    #                                     (>10 %) of taper below the ~3.94 m
    #                                     nominal accel-lane offset, i.e. the
    #                                     road geometry itself is now funneling
    #                                     toward route:0. Derived at startup;
    #                                     it is NOT merge_standoff_m (that is
    #                                     the response's WAIT/HOLD boundary and
    #                                     stays owned upstream).
    #   mission_exit_release_m          : COMPLETE ends this far past
    #                                     merge_complete (ego established on the
    #                                     target corridor).
    #   mission_route_s_reset_jump_m    : a backward jump in ego route_s larger
    #                                     than this in one tick is a sim reset
    #                                     or the 2184 m route loop wrapping ->
    #                                     mission resets to INACTIVE. Derived
    #                                     from ~2 x control_period (0.05 s) x
    #                                     the 33.33 m/s merge-region speed limit.
    enable_highway_merge_mission: false
    mission_approach_window_m: 400.0
    commit_lateral_separation_m: 3.5
    mission_exit_release_m: 20.0
    mission_route_s_reset_jump_m: 3.5
    highway_merge_mission_zone_id: "kcity_highway_onramp"
    # Empty -> ad_planner/config/highway_merge.json from the package share.
    merge_geometry_file: ""

    # Current Stanley baseline: dynamic steering preview + curvature speed cap.
    stanley.target_speed_mps: 16.25
    stanley.cross_track_gain: 0.91
    stanley.speed_softening_mps: 2.57
    stanley.lookahead_time_s: 0.16
    stanley.lookahead_min_m: 1.5
    stanley.lookahead_max_m: 5.0
    stanley.curvature_lookahead_m: 1.0
    stanley.curvature_window_radius: 5
    stanley.heading_error_gain: 1.0
    stanley.lateral_acceleration_mps2: 6.0
    stanley.minimum_speed_mps: 1.3888888889
    stanley.maximum_speed_mps: 16.6666666667
    stanley.acceleration_mps2: 2.0
    stanley.deceleration_mps2: 2.0
    # Add zones by increasing count and appending another numbered block.
    # CP14 -> CP15 is the GNSS-shadow/FastLIO section and always runs at 30 km/h.
    stanley.speed_zones.count: 1
    stanley.speed_zones.0.start_xy_m: [38.868875371112615, -480.68740975673563]
    stanley.speed_zones.0.end_xy_m: [-81.83284234744308, -547.3316347631321]
    stanley.speed_zones.0.maximum_speed_mps: 8.3333333333
    stanley.launch_speed_mps: 1.3888888889
    stanley.launch_ramp_s: 4.0
    stanley.forward_window: 200
    stanley.maximum_laps: 1
    stanley.speed_pid.kp: 1.08
    stanley.speed_pid.ki: 0.0
    stanley.speed_pid.kd: 0.036
    stanley.speed_pid.integral_limit: 100.0
    stanley.speed_pid.derivative_limit: 10.0
    stanley.speed_pid.derivative_filter_time_constant_s: 0.1
    stanley.brake_pid.kp: 0.2
    stanley.brake_pid.ki: 0.0
    stanley.brake_pid.kd: 0.01

    # Profile Stanley uses the measured IONIQ 5 longitudinal envelope.
    # Source:
    #   accelerator-map-v1/profile.csv at 100% command
    #   brake-map-v2/profile.csv at 20% command
    # Generated by scripts/export_longitudinal_profile.py on 2026-07-27.
    # The full-throttle acceleration envelope drives the forward pass after a
    # curve. The brake envelope and delay drive the backward pass before it.
    profile_stanley.target_speed_mps: 16.25
    # Best feasible candidate from shared study 117, trial 668 (heven-left).
    profile_stanley.cross_track_gain: 1.2590347192291622
    profile_stanley.speed_softening_mps: 1.8151037682456395
    profile_stanley.lookahead_time_s: 0.0829957038411917
    profile_stanley.lookahead_min_m: 1.5
    profile_stanley.lookahead_max_m: 5.0
    profile_stanley.curvature_lookahead_m: 2.818227339182336
    profile_stanley.curvature_window_radius: 5
    profile_stanley.heading_error_gain: 0.8204460682192964
    profile_stanley.lateral_acceleration_mps2: 6.0
    profile_stanley.forward_window: 200
    profile_stanley.maximum_laps: 1
    profile_stanley.speed_pid.kp: 0.35523299734554153
    profile_stanley.speed_pid.ki: 0.0
    profile_stanley.speed_pid.kd: 0.007949498723771662
    profile_stanley.speed_pid.integral_limit: 100.0
    profile_stanley.speed_pid.derivative_limit: 10.0
    profile_stanley.speed_pid.derivative_filter_time_constant_s: 0.1
    profile_stanley.brake_pid.kp: 0.1869594609763207
    profile_stanley.brake_pid.ki: 0.0
    profile_stanley.brake_pid.kd: 0.014300904664999885
    profile_stanley.minimum_speed_mps: 1.3888888889
    profile_stanley.maximum_speed_mps: 16.6666666667
    profile_stanley.acceleration_mps2: 5.0
    profile_stanley.deceleration_mps2: 2.0
    profile_stanley.speed_zones.count: 1
    profile_stanley.speed_zones.0.start_xy_m: [38.868875371112615, -480.68740975673563]
    profile_stanley.speed_zones.0.end_xy_m: [-81.83284234744308, -547.3316347631321]
    profile_stanley.speed_zones.0.maximum_speed_mps: 8.3333333333
    profile_stanley.launch_speed_mps: 1.3888888889
    profile_stanley.launch_ramp_s: 3.0
    profile_stanley.longitudinal_profile.speed_mps: [1.388888889, 2.777777778, 4.166666667, 5.555555556, 6.944444444, 8.333333333, 9.722222222, 11.111111111, 12.5, 13.888888889, 15.277777778]
    profile_stanley.longitudinal_profile.acceleration_mps2: [4.422133433, 4.003169592, 3.688007844, 3.594037245, 3.564077446, 3.558017657, 3.532980823, 3.5313351, 3.503538525, 3.505896377, 3.487892617]
    profile_stanley.longitudinal_profile.deceleration_mps2: [3.670262249, 3.617239635, 3.586904013, 3.464571008, 2.118385009, 1.832400025, 1.829604241, 1.837794547, 1.835002459, 1.845794044, 1.825491215]
    profile_stanley.longitudinal_profile.braking_delay_s: 0.11589156

    speed_pid.kp: 0.3
    speed_pid.ki: 0.0
    speed_pid.kd: 0.01
    speed_pid.integral_limit: 10.0
    speed_pid.derivative_limit: 10.0

    maximum_steering_rad: 0.6981317

    freshness.status_sec: 0.5
    freshness.collision_sec: 0.5
    freshness.grid_sec: 0.5
    freshness.traffic_sec: 0.5
    freshness.stop_line_sec: 0.5

    collision.reverse_accel: 0.2
    collision.reverse_duration_sec: 2.0
    collision.reverse_brake_sec: 1.0
    collision.cooldown_sec: 2.0
    traffic.stop_line_enabled: false
    # MGeo stop-line points are rear-axle coordinates only for map projection.
    # Runtime braking reserves the 3.845 m rear-axle-to-front-bumper distance
    # plus 1 m, so the front bumper remains behind the painted line.
    traffic.lateral_tolerance_m: 2.0
    traffic.zone_exit_radius_m: 3.0
    traffic.stopping_margin_m: 1.0
    traffic.reaction_time_sec: 0.11589156
    traffic.braking_deceleration_mps2: 1.8
    traffic.brake_command: 0.2
    # Use the measured 20% brake profile during an on-time approach. If the
    # required deceleration exceeds that profile by 15%, the stop is already
    # late and full brake minimizes stop-line overrun.
    traffic.late_brake_deceleration_ratio: 1.15
    # Require a short continuous red observation before initiating a stop.
    traffic.red_confirmation_duration_sec: 0.2
    # A single flickering green frame must not release a stopped vehicle.
    traffic.green_release_duration_sec: 0.5
    traffic.zones.count: 5
    traffic.zones.0.xy_m: [-93.96744188736193, -255.75045508425683]
    traffic.zones.1.xy_m: [-59.83293701335788, -155.39320968370885]
    traffic.zones.2.xy_m: [-60.15604465093929, -34.51018160348758]
    traffic.zones.3.xy_m: [-60.8764564244193, 79.3064151215367]
    traffic.zones.4.xy_m: [-12.693221560504753, 98.93261842010543]
    perception.enabled: true
    # Query occupied road cells along route progress rather than a straight
    # base_link rectangle, so curves and adjacent roadside objects are handled
    # consistently.
    perception.route_aligned_activation: true
    perception.clear_release_duration_sec: 2.0
    # Activate local avoidance early enough to react and brake at road speed.
    # far_x = front bumper + margin + v*reaction + v^2/(2*deceleration)
    perception.speed_aware_lookahead: true
    perception.near_x_m: 1.0
    perception.minimum_lookahead_m: 20.0
    # 58.5 km/h needs about 98.5 m with the conservative 1.8 m/s^2 model.
    perception.maximum_lookahead_m: 99.0
    perception.front_bumper_x_m: 3.845
    perception.reaction_time_sec: 1.0
    perception.braking_deceleration_mps2: 1.8
    perception.stopping_margin_m: 5.0
    # Current dynamic footprints remain in the dynamic OGM. This separate,
    # bounded signal only activates local planning when a tracked object's
    # future swept prediction intersects the local road corridor.
    perception.future_road_risk.horizon_sec: 6.0
    perception.future_road_risk.maximum_objects: 128
    perception.future_road_risk.maximum_footprints: 2048
    perception.future_road_risk.maximum_corridor_segments: 4096
    perception.future_road_risk.covariance_sigma: 2.0
    perception.future_road_risk.minimum_margin_m: 0.20
    perception.forward_check_pose.x: 5.5
    perception.forward_check_pose.y: 0.0
    perception.forward_check_pose.yaw_rad: 0.0
    perception.forward_check_footprint.half_length_m: 4.2
    perception.forward_check_footprint.half_width_m: 1.2
    perception.forward_check_footprint.clearance_m: 0.1
    perception.forward_check_footprint.occupied_threshold: 50
    perception.forward_check_footprint.maximum_cells_to_check: 32768

    visualization.profile_sample_stride: 10
    visualization.route_relevance_period_sec: 0.20

    topics.vehicle_status: "/ad/vehicle/status"
    topics.odometry: "/ad/localization/odometry"
    topics.collisions: "/ad/safety/collisions"
    topics.occupancy_grid: "/ad/perception/occupancy_grid"
    topics.drivable_mask: "/ad/planning/drivable_mask"
    topics.predicted_objects: "/ad/perception/objects/predicted"
    topics.traffic_signal: "/ad/perception/traffic_signal"
    topics.stop_line: "/ad/perception/stop_line"
    # Only subscribed / published when enable_cut_in_response_constraint is true.
    topics.cut_in_response: "/ad/planning/cut_in_response"
    topics.cut_in_speed_limit: "/ad/planner/cut_in_speed_limit"
    # Only subscribed / published when enable_roundabout_response_constraint is
    # true.
    topics.roundabout_gap_response: "/ad/planning/roundabout_gap_response"
    topics.roundabout_speed_limit: "/ad/planner/roundabout_speed_limit"
    # Only subscribed / published when
    # enable_highway_merge_response_integration is true.
    topics.highway_merge_gap_response: "/ad/planning/highway_merge_gap_response"
    topics.highway_merge_speed_limit: "/ad/planner/highway_merge_speed_limit"
    topics.highway_merge_authorized: "/ad/planner/highway_merge_authorized"
    # Only published when enable_highway_merge_mission is true.
    topics.highway_merge_mission_state: "/ad/planner/highway_merge_mission_state"
    topics.command: "/ad/control/command"
    topics.planner_status: "/ad/planner/status"
    topics.path: "/ad/planner/path"
    topics.target_speed: "/ad/planner/target_speed"

    # Visualization-only topics. Planning and control never consume these.
    visualization.topics.static_ungated: "/ad/viz/perception/occupancy/static_ungated"
    visualization.topics.local_path: "/ad/viz/planner/local_path"
    visualization.topics.target: "/ad/viz/planner/target"
    visualization.topics.candidate_paths: "/ad/viz/planner/candidate_paths"
    visualization.topics.path_tracking: "/ad/viz/planner/path_tracking"
    visualization.topics.occupancy_relevance: "/ad/viz/planner/occupancy_relevance"
    visualization.topics.relevant_objects: "/ad/viz/planner/relevant_objects"
