/**:
  ros__parameters:
    # COMPETITION_MOT_BASELINE_V1
    # Detector is selected separately by lidar_perception.yaml and is required
    # to be adaptive Euclidean clustering by lidar_perception.launch.py.
    association_metric: euclidean
    euclidean_gate_m: 3.0
    matcher: hungarian
    state_estimator: linear_kf
    yaw_measurement_mode: unobserved

    # Preserve the existing AB3DMOT lifecycle; this task does not tune it.
    min_hits: 1
    max_age: 2

    # Explicit unused alternatives prevent inheritance from historical node
    # defaults and make the complete parameter surface reproducible.
    giou_gate: 0.0
    mahalanobis_gate: 11.62
    mahalanobis_max_distance_m: 0.0
    imm_cv_to_cv_probability: 0.95
    imm_ctrv_to_ctrv_probability: 0.95
    kalmannet_checkpoint: ""
    kalmannet_device: cpu

    # Runtime observability only; does not affect tracker state or timing input.
    runtime_summary_interval_frames: 180

    # Option C published-uncertainty bound (fix/ab3dmot-covariance-stability).
    # The reference AB3DMOT birth prior is P0_pos = 10 m^2, P0_vel = 10000
    # (m/s)^2; a track that is born (min_hits=1) then never re-associated
    # coasts exactly ONE predict() step before max_age=2 deletes it, and
    # F[0,7]=dt propagates dt^2 * P0_vel ~= 360 m^2 into position variance
    # (std ~= 19 m) for that single published frame. The internal KF P is
    # left untouched (changing it alters the Kalman gain and the associated
    # track set -- measured); only the covariance written into the outgoing
    # TrackedObject is clipped, via PSD-preserving eigenvalue clipping, so
    # HEVEN prediction / Dynamic OGM do not inflate a one-frame reachability
    # blob. Value = sqrt(P0_pos 10 m^2 + (v_max 31 m/s * one coast step
    # ~0.2 s)^2) ~= 6.96 m, rounded up. v_max is the top of the actor speeds
    # measured in this dataset (T-11). Coupled to max_age=2: raising max_age
    # means more coast steps and this bound must be revisited.
    maximum_position_std_m: 7.0
