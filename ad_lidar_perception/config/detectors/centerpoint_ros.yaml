/**:
  ros__parameters:
    # Safe defaults: the production Euclidean backend remains selected.
    detector_backend: euclidean
    enabled: false
    mock_mode: false
    checkpoint_path: ""
    openpcdet_root: ""
    device: cuda:0
    score_threshold: 0.1
    max_detections: 500
    point_cloud_range: [-4.0, -25.0, -3.0, 100.0, 25.0, 5.0]
    input_topic: /ad/perception/lidar/cropped
    output_topic: /ad/perception/objects/detected
