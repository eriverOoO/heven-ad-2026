/**:
  ros__parameters:
    queue_capacity: 4096
    timestamp_mode: arrival
    source_stamp_tolerance_sec: 1.0
    publish_raw_packets: false

    competition_status:
      enabled: true
      bind_ip: 127.0.0.1
      port: 21909
      topic: /ad/vehicle/status
      frame_id: map
      receive_buffer_bytes: 4194304
      stale_after_sec: 1.0

    collisions:
      enabled: true
      bind_ip: 127.0.0.1
      port: 29092
      topic: /ad/safety/collisions
      frame_id: map
      receive_buffer_bytes: 4194304
      stale_after_sec: 1.0

    camera_front:
      enabled: true
      bind_ip: 127.0.0.1
      port: 29291
      topic: /ad/sensors/camera/front/compressed
      frame_id: camera_front_optical_frame
      receive_buffer_bytes: 16777216
      stale_after_sec: 1.0

    camera_left:
      enabled: true
      bind_ip: 127.0.0.1
      port: 29293
      topic: /ad/sensors/camera/left/compressed
      frame_id: camera_left_optical_frame
      receive_buffer_bytes: 16777216
      stale_after_sec: 1.0

    camera_right:
      enabled: true
      bind_ip: 127.0.0.1
      port: 29295
      topic: /ad/sensors/camera/right/compressed
      frame_id: camera_right_optical_frame
      receive_buffer_bytes: 16777216
      stale_after_sec: 1.0

    camera_traffic_light:
      enabled: true
      bind_ip: 127.0.0.1
      port: 29307
      topic: /ad/sensors/camera/traffic_light/compressed
      frame_id: camera_traffic_light_optical_frame
      receive_buffer_bytes: 16777216
      stale_after_sec: 1.0

    gps:
      enabled: true
      bind_ip: 127.0.0.1
      port: 29297
      topic: /ad/sensors/gps/fix
      frame_id: gps_link
      receive_buffer_bytes: 4194304
      stale_after_sec: 1.0

    imu:
      enabled: true
      bind_ip: 127.0.0.1
      port: 29299
      topic: /ad/sensors/imu/data
      frame_id: imu_link
      receive_buffer_bytes: 4194304
      stale_after_sec: 1.0

    velodyne:
      enabled: true
      bind_ip: 127.0.0.1
      port: 22368
      topic: /ad/sensors/lidar/raw
      frame_id: lidar_link
      receive_buffer_bytes: 16777216
      stale_after_sec: 1.0

    control:
      enabled: false
      target_ip: 127.0.0.1
      target_port: 29093
      topic: /ad/control/command
      watchdog_timeout_sec: 0.2
      fallback_interval_sec: 0.1
