# Same as competition.yaml except which streams are enabled (tunnel premapping).
/**:
  ros__parameters:
    queue_capacity: 4096
    timestamp_mode: arrival
    source_stamp_tolerance_sec: 1.0
    publish_raw_packets: false

    competition_status:
      enabled: true
      bind_ip: 127.0.0.1
      port: 1909
      topic: /ad/vehicle/status
      frame_id: map
      receive_buffer_bytes: 4194304
      stale_after_sec: 1.0

    collisions:
      # The behavior tree treats collision freshness as a mandatory safety
      # input even in obstacle-free premapping runs.
      enabled: true
      bind_ip: 127.0.0.1
      port: 9092
      topic: /ad/safety/collisions
      frame_id: map
      receive_buffer_bytes: 4194304
      stale_after_sec: 1.0

    camera_front:
      enabled: false
      bind_ip: 127.0.0.1
      port: 9291
      topic: /ad/sensors/camera/front/compressed
      frame_id: camera_front_optical_frame
      receive_buffer_bytes: 16777216
      stale_after_sec: 1.0

    camera_left:
      enabled: false
      bind_ip: 127.0.0.1
      port: 9293
      topic: /ad/sensors/camera/left/compressed
      frame_id: camera_left_optical_frame
      receive_buffer_bytes: 16777216
      stale_after_sec: 1.0

    camera_right:
      enabled: false
      bind_ip: 127.0.0.1
      port: 9295
      topic: /ad/sensors/camera/right/compressed
      frame_id: camera_right_optical_frame
      receive_buffer_bytes: 16777216
      stale_after_sec: 1.0

    camera_traffic_light:
      enabled: false
      bind_ip: 127.0.0.1
      port: 9307
      topic: /ad/sensors/camera/traffic_light/compressed
      frame_id: camera_traffic_light_optical_frame
      receive_buffer_bytes: 16777216
      stale_after_sec: 1.0

    gps:
      enabled: true
      bind_ip: 127.0.0.1
      port: 9297
      topic: /ad/sensors/gps/fix
      frame_id: gps_link
      receive_buffer_bytes: 4194304
      stale_after_sec: 1.0

    imu:
      enabled: true
      bind_ip: 127.0.0.1
      port: 9299
      topic: /ad/sensors/imu/data
      frame_id: imu_link
      receive_buffer_bytes: 4194304
      stale_after_sec: 1.0

    velodyne:
      enabled: true
      bind_ip: 127.0.0.1
      port: 2368
      topic: /ad/sensors/lidar/raw
      frame_id: lidar_link
      receive_buffer_bytes: 16777216
      stale_after_sec: 1.0

    control:
      enabled: false
      target_ip: 127.0.0.1
      target_port: 9093
      topic: /ad/control/command
      watchdog_timeout_sec: 0.2
      fallback_interval_sec: 0.1
