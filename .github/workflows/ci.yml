name: CI

# Draft가 아닌 PR은 source를 새로 checkout한 뒤 전체 HEVEN stack을
# build/test한다. ROS 2와 APT 의존성만 GHCR image에서 재사용한다.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: Ignore an existing tag and refresh APT dependencies
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "23 17 * * 0"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-image:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.final-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate dependency image key
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(python3 scripts/ci_image_fingerprint.py --root .)"
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}-ci"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "image-name=$image_name" >> "$GITHUB_OUTPUT"
          echo "image-tag=${image_name}:humble-${fingerprint}" >> "$GITHUB_OUTPUT"

      - name: Resolve existing dependency image
        id: lookup
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REBUILD_IMAGE: ${{ inputs.rebuild_image || 'false' }}
          IMAGE_NAME: ${{ steps.fingerprint.outputs.image-name }}
          IMAGE_TAG: ${{ steps.fingerprint.outputs.image-tag }}
        run: |
          set -euo pipefail
          force_rebuild=false
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            force_rebuild=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REBUILD_IMAGE" == "true" ]]; then
            force_rebuild=true
          fi

          if [[ "$force_rebuild" == "false" ]] \
            && inspection="$(docker buildx imagetools inspect "$IMAGE_TAG" 2>/dev/null)"
          then
            digest="$(awk '$1 == "Digest:" {print $2; exit}' <<< "$inspection")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "unable to resolve manifest digest for $IMAGE_TAG" >&2
              exit 1
            fi
            # Output contract: <image>@sha256:<manifest digest>
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "image=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push dependency image
        id: push
        if: ${{ steps.lookup.outputs.build == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/ci/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.fingerprint.outputs.image-tag }}
          build-args: |
            APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
            DEPENDENCY_FINGERPRINT=${{ steps.fingerprint.outputs.fingerprint }}
          cache-from: type=gha,scope=heven-ci-dependencies-amd64
          cache-to: type=gha,mode=max,scope=heven-ci-dependencies-amd64
          provenance: true

      - name: Select exact dependency image digest
        id: final-image
        shell: bash
        env:
          BUILT: ${{ steps.lookup.outputs.build }}
          EXISTING_IMAGE: ${{ steps.lookup.outputs.image }}
          IMAGE_NAME: ${{ steps.fingerprint.outputs.image-name }}
          BUILT_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$BUILT" == "true" ]]; then
            if [[ ! "$BUILT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "build did not return an OCI manifest digest" >&2
              exit 1
            fi
            echo "image=${IMAGE_NAME}@${BUILT_DIGEST}" >> "$GITHUB_OUTPUT"
          else
            [[ "$EXISTING_IMAGE" == *@sha256:* ]]
            echo "image=$EXISTING_IMAGE" >> "$GITHUB_OUTPUT"
          fi

  build:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    needs: prepare-image
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.prepare-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ws/src/heven_ad_2026
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify dependency image contract
        working-directory: ws/src/heven_ad_2026
        run: |
          set -euo pipefail
          expected="$(python3 scripts/ci_image_fingerprint.py --root .)"
          actual="$(< /opt/heven-ci/dependency-fingerprint)"
          [[ "$actual" == "$expected" ]]
          set +u
          source /opt/ros/humble/setup.bash
          set -u
          command -v ccache git-lfs rosdep vcs colcon >/dev/null

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: ws/src/heven_ad_2026
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-v1-${{ runner.os }}-humble-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-humble-

      - name: Configure compiler cache
        run: |
          ccache --max-size=8G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Verify Git LFS payloads
        working-directory: ws/src/heven_ad_2026
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck
          python3 scripts/verify_ad_data.py --root .

      - name: Import pinned source dependencies
        working-directory: ws
        run: |
          vcs import src \
            --input src/heven_ad_2026/dependencies.repos \
            --shallow \
            --skip-existing
          src/heven_ad_2026/scripts/apply_dependency_patches.sh "$PWD/src"

      - name: Discover HEVEN build closure
        working-directory: ws
        run: |
          set -euo pipefail
          set +u
          source /opt/ros/humble/setup.bash
          set -u
          colcon list --base-paths src/heven_ad_2026 --names-only \
            | sort -u > heven-packages.txt
          test -s heven-packages.txt
          mapfile -t HEVEN_PACKAGES < heven-packages.txt
          readonly -a REQUIRED_RUNTIME_PACKAGES=(
            autoware_multi_object_tracker
          )
          printf '%s\n' \
            "${HEVEN_PACKAGES[@]}" \
            "${REQUIRED_RUNTIME_PACKAGES[@]}" \
            > heven-build-roots.txt
          mapfile -t HEVEN_BUILD_ROOTS < heven-build-roots.txt
          colcon list --packages-up-to "${HEVEN_BUILD_ROOTS[@]}" --paths-only \
            | sort -u > heven-package-paths.txt
          test -s heven-package-paths.txt
          cat heven-packages.txt

      - name: Run repository contract tests
        working-directory: ws/src/heven_ad_2026
        run: |
          ./scripts/test_python.sh

      - name: Build complete HEVEN stack
        working-directory: ws
        run: |
          set -euo pipefail
          set +u
          source /opt/ros/humble/setup.bash
          set -u
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          export MAKEFLAGS="-j2 -l2"
          PROJECT_PYTHON="$PWD/src/heven_ad_2026/.venv/bin/python3"
          mapfile -t HEVEN_BUILD_ROOTS < heven-build-roots.txt
          colcon build \
            --executor sequential \
            --symlink-install \
            --packages-up-to "${HEVEN_BUILD_ROOTS[@]}" \
            --event-handlers console_cohesion+ \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DPython3_EXECUTABLE="$PROJECT_PYTHON" \
              -DPYTHON_EXECUTABLE="$PROJECT_PYTHON"

      - name: Show compiler cache statistics
        if: ${{ always() }}
        run: ccache --show-stats

      - name: Save compiler cache
        if: ${{ always() && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-v1-${{ runner.os }}-humble-${{ github.sha }}

      - name: Test complete HEVEN stack
        working-directory: ws
        run: |
          set -euo pipefail
          set +u
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          source src/heven_ad_2026/.venv/bin/activate
          set -u
          VENV_SITE_PACKAGES="$(
            src/heven_ad_2026/.venv/bin/python3 -c \
              'import site; print(site.getsitepackages()[0])'
          )"
          export PYTHONPATH="$VENV_SITE_PACKAGES${PYTHONPATH:+:$PYTHONPATH}"
          export CTEST_PARALLEL_LEVEL=1
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          mapfile -t HEVEN_PACKAGES < heven-packages.txt
          colcon test \
            --executor sequential \
            --packages-select "${HEVEN_PACKAGES[@]}" \
            --event-handlers console_cohesion+ \
            --metas src/heven_ad_2026/colcon.meta
          colcon test \
            --executor sequential \
            --packages-select \
              kalman_filter_localization_core \
              kalman_filter_localization \
            --ctest-args -LE linter
          colcon test-result --verbose
