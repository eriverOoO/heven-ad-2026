dynamic_obstacle_detector:
  ros__parameters:
    image_topic: /ad/sensors/camera/front/compressed
    image_transport: compressed
    detections_topic: /vision/dynamic_obstacle/detections
    model_path: yolo26s.pt
    device: auto
    image_size: 640
    confidence_threshold: 0.20
    maximum_inference_rate: 20.0
    crop_enabled: true
    crop_normalized: [0.0, 0.2, 1.0, 1.0]
    excluded_class_ids: [9, 10, 11, 12]

dynamic_obstacle_visualizer:
  ros__parameters:
    image_topic: /ad/sensors/camera/front/compressed
    image_transport: compressed
    detections_topic: /vision/dynamic_obstacle/detections
    output_image_topic: /ad/viz/perception/camera/dynamic_obstacle
    image_buffer_size: 10
    crop_normalized: [0.0, 0.2, 1.0, 1.0]
    show_window: false
    window_name: dynamic_obstacle_debug

dynamic_obstacle_evaluator:
  ros__parameters:
    danger_roi_normalized: [0.32, 0.48, 0.68, 0.48, 0.90, 1.0, 0.10, 1.0]
    minimum_confidence: 0.20
    minimum_box_area_ratio: 0.001
    activation_window_frames: 3
    activation_required_frames: 2
    release_clear_frames: 5
    stale_timeout_sec: 0.5
