ad_dwa_tuner:
  ros__parameters:
    # This is the first full search, not a simulator-free smoke test.
    maximum_trials: 120
    maximum_total_trials: 150
    minimum_feasible_trials: 30
    maximum_consecutive_infrastructure_failures: 3
    maximum_worker_wall_time_sec: 14400.0
    seed: 20260729
    # 같은 장애물 경로/스택의 충분히 큰 이전 study에서 상위 feasible
    # 파라미터를 가져와 현재 metric으로 다시 평가한다.
    warm_start.inherit_minimum_complete_trials: 40
    warm_start.inherit_top_k: 5
    output_dir: ""
    worker_id: ""

    storage.url_env: "OPTUNA_STORAGE_URL"
    storage.heartbeat_interval_sec: 15
    storage.heartbeat_grace_period_sec: 90
    storage.heartbeat_retry_count: 1
    storage.connect_timeout_sec: 3
    storage.connection_retry_attempts: 6
    storage.connection_retry_interval_sec: 5.0
    storage.health_check_interval_sec: 2.0
    storage.db_outage_abort_sec: 30.0
    experiment.scenario: "unspecified"
    experiment.scenario_file: ""
    experiment.weather: "unspecified"
    experiment.morai_version: "S4.251001"
    experiment.code_revision: "unspecified"
    experiment.vehicle_profile_id: "20260727-ioniq5-accelerator40-brake20-v1"
    experiment.data_dir: ""

    course_length_m: 0.0
    completion_margin_m: 5.0
    startup_timeout_sec: 60.0
    trial_timeout_sec: 420.0
    trial_wall_timeout_sec: 600.0
    sim_clock_stale_timeout_sec: 5.0
    maximum_sim_step_sec: 0.5
    timing.require_device_stamp: true
    timing.require_occupancy_grid: true
    scenario_reset.required: true
    scenario_reset.service: "/ad/dev/scenario/reset"
    # Autoware expires unmeasured tracks after 1.0 simulator second. Keep the
    # vehicle held until a newer prediction epoch has crossed that boundary.
    perception_reset.required: true
    perception_reset.settle_sim_sec: 1.05
    perception_reset.minimum_prediction_samples: 5
    perception_reset.prediction_frame_id: "odom"
    reset_timeout_sec: 12.0
    stop_timeout_sec: 8.0
    start_tolerance_m: 1.0
    start_heading_tolerance_deg: 3.0
    start_speed_tolerance_mps: 0.2
    start_maximum_xy_variance_m2: 1.0
    start_stable_sample_count: 5
    completion_position_tolerance_m: 8.0
    completion_heading_tolerance_deg: 30.0
    maximum_progress_jump_m: 20.0
    metric_control_point_x_m: 3.0
    input_stale_timeout_sec: 2.0
    divergence_cte_m: 12.0
    maximum_pose_jump_m: 20.0
    wrong_way_heading_deg: 120.0
    overspeed_kph: 60.0
    brake_metric_speed_deadband_kph: 1.0
    brake_saturation_threshold: 0.95

    # Avoidance may legitimately enter an adjacent lane, so the Stanley
    # centerline-only 0.8 m feasibility limit is not reused here. Collision
    # remains an absolute constraint and the CTE terms still prefer returning
    # toward the primary global path.
    objective.maximum_cte_m: 4.5
    objective.elapsed_time_weight: 1.0
    objective.front_cte_squared_weight: 5.0
    objective.rear_cte_squared_weight: 5.0
    objective.competition_overspeed_penalty_s: 15.0
    objective.competition_overspeed_interval_s: 3.0
    objective.target_overspeed_squared_weight: 1.0
    objective.unnecessary_brake_squared_weight: 5.0
    objective.brake_saturation_time_weight: 1.0
    objective.maximum_collision_count: 0
    objective.minimum_local_planner_active_sec: 1.0
    objective.collision_penalty: 5000.0
    # A short no-candidate interval is already reflected in time/stall. Keep
    # this metric observable without double-counting it in the first pilot.
    objective.local_planner_failure_time_weight: 0.0
    objective.incomplete_penalty: 2000.0
    objective.incomplete_cte_weight: 0.0
